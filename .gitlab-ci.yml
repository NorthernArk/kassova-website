# kassova.com, the public Kassova marketing site: Astro, static, served by GitHub Pages
# (kassova/website#2, docs/adr/0001-astro-site-and-lead-intake.md).
#
# Source of truth: this GitLab repo, branch main. git-mirror-sync (DroidOpsInc/nebula) mirrors
# this repo to the public GitHub repo NorthernArk/kassova-website, and GitHub Pages serves it at
# the custom domain in CNAME. The repository, its Pages settings and DNS are Terraform in
# FocusApiary/infrastructure. No token or secret lives here.
#
# Release path: site:build checks and builds every MR and main push. On main, pages:publish
# rebuilds with the live intake endpoint and fast-forwards the built site onto the gh-pages
# branch, which the mirror carries to GitHub and Pages serves. pages:publish is off until
# GH_PAGES_PUBLISH below is "true", which is set in git once Pages serves gh-pages (runbook).
# Until then Pages serves main's root, where the transitional index.html and CNAME stay.
#
# The lead intake (Logic App into D365) is ci/intake.gitlab-ci.yml.
include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/pipelines/static-site.yml'
  - local: ci/site.gitlab-ci.yml
  - local: ci/intake.gitlab-ci.yml

variables:
  GITHUB_REPO: "NorthernArk/kassova-website"
  GITHUB_MIRROR_EXTERNAL: "true"
  SITE_DIR: "."
  KASSOVA_NODE_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/library/node:24.18.1-bookworm"
  # Flipped to "true" in git once Pages serves the gh-pages branch (docs/lead-intake-runbook.md).
  GH_PAGES_PUBLISH: "false"

# Reads https://kassova.com from outside: apex 200 with this site, http -> https,
# www -> apex. Runs from a schedule or by hand (web).
verify:live:
  stage: mirror
  image: ${IMAGE_REGISTRY}/dockerhub-proxy/alpine/k8s:1.37.2
  needs: []
  script:
    - sh ci/verify-live.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
